name: Build Nuvio3DS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install 3DS portlibs and makerom
        run: |
          dkp-pacman -Syu --noconfirm 3ds-curl 3ds-mbedtls 3ds-zlib
          apt-get update && apt-get install -y curl unzip
          curl -fsSL https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip -o /tmp/makerom.zip
          unzip -o /tmp/makerom.zip -d /usr/local/bin
          chmod +x /usr/local/bin/makerom

      - name: Compile Nuvio3DS (.3dsx + .cia)
        run: |
          if [ -d Nuvio3DS ]; then cd Nuvio3DS; fi
          make cia

      - name: Publish direct .cia release for FBI QR
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Nuvio3DS Latest Build
          files: |
            **/Nuvio3DS.cia
            **/Nuvio3DS.3dsx
            **/nuvio3ds.xml
