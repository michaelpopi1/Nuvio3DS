name: Build Nuvio3DS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install makerom
        run: |
          curl -fsSL https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip -o /tmp/makerom.zip
          unzip -o /tmp/makerom.zip -d /usr/local/bin
          chmod +x /usr/local/bin/makerom

      - name: Compile Nuvio3DS (.3dsx + .cia)
        run: |
          if [ -d Nuvio3DS ]; then cd Nuvio3DS; fi
          make cia

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio3DS-binaries
          path: |
            **/Nuvio3DS.3dsx
            **/Nuvio3DS.smdh
            **/Nuvio3DS.cia
            **/nuvio3ds.xml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Nuvio3DS-binaries
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" dist/* \
            --title "Nuvio3DS v1.0.${{ github.run_number }}" \
            --notes "Compiled Nuvio3DS (.cia + .3dsx)" \
            --latest
