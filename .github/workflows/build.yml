release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Nuvio3DS-binaries
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "Nuvio3DS v1.0.${{ github.run_number }}" \
            --notes "Compiled Nuvio3DS (.cia + .3dsx)" \
            --latest
